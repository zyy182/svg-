<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="810" viewBox="0 0 1020 810" role="img" aria-label="CLI SVG editor component dependency diagram"><rect width="1020" height="810" fill="#f7f9fc" /><text x="38" y="39" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#17243a">PJ1 Phase 1 · TypeScript CLI SVG editor</text><text x="38" y="66" font-family="Arial,sans-serif" font-size="14" fill="#536277">Arrows point from a consumer to a dependency. The file adapter implements the application port.</text><rect x="40" y="110" width="205" height="258" rx="14" fill="#e4eefc" stroke="#2e68b2" stroke-width="2" /><text x="57" y="138" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#2e68b2">src/cli</text><rect x="57" y="170" width="171" height="42" rx="7" fill="white" stroke="#2e68b2" stroke-width="1" /><text x="70" y="197" font-family="Arial,sans-serif" font-size="14" fill="#17243a">Cli</text><rect x="57" y="236" width="171" height="42" rx="7" fill="white" stroke="#2e68b2" stroke-width="1" /><text x="70" y="263" font-family="Arial,sans-serif" font-size="14" fill="#17243a">CommandRegistry</text><rect x="57" y="302" width="171" height="42" rx="7" fill="white" stroke="#2e68b2" stroke-width="1" /><text x="70" y="329" font-family="Arial,sans-serif" font-size="14" fill="#17243a">Tokenizer</text><rect x="285" y="110" width="280" height="525" rx="14" fill="#e9f4ec" stroke="#2a7b49" stroke-width="2" /><text x="302" y="138" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#2a7b49">src/application</text><rect x="302" y="170" width="246" height="42" rx="7" fill="white" stroke="#2a7b49" stroke-width="1" /><text x="315" y="197" font-family="Arial,sans-serif" font-size="14" fill="#17243a">Concrete commands</text><rect x="302" y="236" width="246" height="42" rx="7" fill="white" stroke="#2a7b49" stroke-width="1" /><text x="315" y="263" font-family="Arial,sans-serif" font-size="14" fill="#17243a">Command / EditCommand</text><rect x="302" y="302" width="246" height="42" rx="7" fill="white" stroke="#2a7b49" stroke-width="1" /><text x="315" y="329" font-family="Arial,sans-serif" font-size="14" fill="#17243a">DocumentSession</text><rect x="302" y="368" width="246" height="42" rx="7" fill="white" stroke="#2a7b49" stroke-width="1" /><text x="315" y="395" font-family="Arial,sans-serif" font-size="14" fill="#17243a">CommandHistory</text><rect x="302" y="434" width="246" height="42" rx="7" fill="white" stroke="#2a7b49" stroke-width="1" /><text x="315" y="461" font-family="Arial,sans-serif" font-size="14" fill="#17243a">DocumentStore interface</text><rect x="615" y="110" width="360" height="392" rx="14" fill="#fff2db" stroke="#a36e17" stroke-width="2" /><text x="632" y="138" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#a36e17">src/domain</text><rect x="632" y="170" width="326" height="42" rx="7" fill="white" stroke="#a36e17" stroke-width="1" /><text x="645" y="197" font-family="Arial,sans-serif" font-size="14" fill="#17243a">ShapeFactory</text><rect x="632" y="236" width="326" height="42" rx="7" fill="white" stroke="#a36e17" stroke-width="1" /><text x="645" y="263" font-family="Arial,sans-serif" font-size="14" fill="#17243a">Document</text><rect x="632" y="302" width="326" height="42" rx="7" fill="white" stroke="#a36e17" stroke-width="1" /><text x="645" y="329" font-family="Arial,sans-serif" font-size="14" fill="#17243a">Shape / Group / Leaves</text><rect x="632" y="368" width="326" height="42" rx="7" fill="white" stroke="#a36e17" stroke-width="1" /><text x="645" y="395" font-family="Arial,sans-serif" font-size="14" fill="#17243a">ValueRules / AffineTransform</text><rect x="615" y="550" width="360" height="178" rx="14" fill="#eee8f7" stroke="#73539a" stroke-width="2" /><text x="632" y="578" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#73539a">src/infrastructure</text><rect x="632" y="612" width="326" height="42" rx="7" fill="white" stroke="#73539a" stroke-width="1" /><text x="645" y="639" font-family="Arial,sans-serif" font-size="14" fill="#17243a">SvgFileStore</text><rect x="632" y="678" width="326" height="42" rx="7" fill="white" stroke="#73539a" stroke-width="1" /><text x="645" y="705" font-family="Arial,sans-serif" font-size="14" fill="#17243a">SvgCodec / SvgElement</text><line x1="245" y1="192" x2="285" y2="192" stroke="#5d6b7c" stroke-width="2" marker-end="url(#arrow)" /><line x1="245" y1="258" x2="285" y2="258" stroke="#5d6b7c" stroke-width="2" marker-end="url(#arrow)" /><line x1="565" y1="192" x2="615" y2="192" stroke="#5d6b7c" stroke-width="2" marker-end="url(#arrow)" /><line x1="565" y1="324" x2="615" y2="258" stroke="#5d6b7c" stroke-width="2" marker-end="url(#arrow)" /><line x1="565" y1="456" x2="615" y2="634" stroke="#5d6b7c" stroke-width="2" marker-end="url(#arrow)" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5d6b7c" /></marker></defs><text x="40" y="775" font-family="Arial,sans-serif" font-size="13" fill="#536277">Name dispatch is confined to CommandRegistry and ShapeFactory; these are Phase 2 extension seams.</text></svg>